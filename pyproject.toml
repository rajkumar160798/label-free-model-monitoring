[project]
name = "lfmm"
version = "0.1.0"
description = "Benchmark and toolkit for label-free model monitoring under real temporal drift and label delay"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["model monitoring", "concept drift", "performance estimation", "label delay", "benchmark", "mlops"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Raj_Myakala", email = "myakalarajkumar1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folktables>=0.0.12",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pyreadstat>=1.3.6",
    "requests>=2.34.2",
    "river>=0.26.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
