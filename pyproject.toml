[project]
name = "lfmm"
version = "0.1.0"
description = "Benchmark and toolkit for monitoring ML models before their labels arrive: performance estimation, drift detection and retraining under natural drift and label delay"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Raj Kumar Myakala", email = "myakalarajkumar1998@gmail.com" }
]
keywords = ["model monitoring", "concept drift", "performance estimation", "label delay", "benchmark", "mlops", "drift detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
# Core: streams, tasks, estimators, detectors and retraining on your own data.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Downloading and loading the benchmark's public datasets.
data = [
    "folktables>=0.0.12",
    "pyreadstat>=1.2",
    "requests>=2.28",
]
# ADWIN detectors.
streaming = [
    "river>=0.21",
]
# Everything needed to reproduce the paper.
all = [
    "lfmm[data,streaming]",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/rajkumar160798/label-free-model-monitoring"
Repository = "https://github.com/rajkumar160798/label-free-model-monitoring"
Issues = "https://github.com/rajkumar160798/label-free-model-monitoring/issues"

[project.scripts]
lfmm-download = "lfmm.download.__main__:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lfmm[all]",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical checks on synthetic streams (run with -m slow)"]
addopts = "-m 'not slow'"
